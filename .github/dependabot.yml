version: 2
updates:
  # Expo paketleri SDK ile birlikte güncellenmeli, onları `npx expo install --fix` ile elle güncelliyoruz.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Büyük sürüm atlamaları (TypeScript 7, ESLint 10 gibi) Expo ile uyumsuz olabiliyor, SDK güncellemesiyle birlikte elle yapılır.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native*"
    labels: [bağımlılık]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [bağımlılık]
