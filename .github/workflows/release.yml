# Store yayını: sadece şirket reposunda ve "prod" dalına push edildiğinde ya da elle başlatıldığında çalışır.
# Fork'larda STORE_RELEASE değişkeni ve secret'lar olmadığı için iş hiç başlamaz.
# Mağaza kimlik bilgileri (imza anahtarları, Google Play servis hesabı) repoda değil,
# EAS üzerinde şirket hesabında saklanır. Repoda sadece EXPO_TOKEN secret'ı bulunur.
#
# Hangi platformların yayınlanacağı STORE_PLATFORMS değişkeninden gelir (android, ios ya da all).
# iOS mağaza hesabı hazır olana kadar değer "android" kalır.
name: Store yayını

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform (boş bırakılırsa STORE_PLATFORMS değişkeni kullanılır)
        type: choice
        options: ['', android, ios, all]
        default: ''
      submit:
        description: Build bitince mağazaya gönder (ilk yüklemede kapalı olmalı)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: store-release
  cancel-in-progress: false

jobs:
  release:
    if: vars.STORE_RELEASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # "production" ortamında onaylayıcı tanımlı, yayın onaydan sonra başlar.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Kontroller
        run: |
          npx tsc --noEmit
          npx expo lint --max-warnings 0

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Build EAS sunucularında alınır. Gönderim açıksa bitince mağazaya otomatik yüklenir.
      - name: Build ve mağazaya gönderim
        env:
          PLATFORM: ${{ inputs.platform || vars.STORE_PLATFORMS || 'android' }}
          SUBMIT: ${{ github.event_name == 'push' || inputs.submit }}
        run: |
          args=(--platform "$PLATFORM" --profile production --non-interactive --no-wait)
          if [ "$SUBMIT" = "true" ]; then args+=(--auto-submit); fi
          eas build "${args[@]}"
